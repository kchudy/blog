<article class="post-summary">
  <h2><a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a></h2>
  <p class="post-meta">
    By {{ post.author }} &middot; {{ post.published_at|date:"F j, Y" }}
    {% if post.tags.all %}
      &middot;
      {% for tag in post.tags.all %}{{ tag.name }}{% if not forloop.last %}, {% endif %}{% endfor %}
    {% endif %}
  </p>
  {% if show_excerpt %}
    <p class="post-excerpt">{{ post.body_html|striptags|truncatewords:30 }}</p>
  {% endif %}
</article>
