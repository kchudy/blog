<form action="{% url 'blog:search' %}" method="get" class="search-form" role="search">
  <label class="search-box search-box--submit">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M21 21l-4.3-4.3"></path>
    </svg>
    <span class="visually-hidden">{{ search_form.q.label }}</span>
    {{ search_form.q }}
  </label>
  <button type="submit" class="btn btn--ghost btn--sm">Search</button>
</form>
