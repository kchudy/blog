[project]
name = "blog"
version = "0.1.0"
description = "Self-hosted, Django-based publishing platform for long-form articles."
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "django-environ>=0.11",
  "markdown>=3.7",
  "bleach>=6.1",
  "gunicorn>=23.0",
  "whitenoise>=6.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["blog/tests"]
