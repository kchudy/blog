services:
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in the environment}
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: sqlite:////data/db.sqlite3
    volumes:
      - sqlite_data:/data
    ports:
      - "8080:8000"
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  sqlite_data:
