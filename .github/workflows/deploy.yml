name: Deploy

# Runs after CI (lint + test, see ci.yml) succeeds on main — this never builds/deploys a commit
# that hasn't passed CI first.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Only relevant if the ghcr.io package is private (GHCR_PAT needs `read:packages`) — a
      # public package needs neither this step nor the `imagePullSecrets` field in
      # k8s/deployment.yaml. Refreshed on every deploy since it's created from a repo secret
      # rather than the (short-lived) GITHUB_TOKEN, so pulls keep working between deploys too.
      - name: Sync GHCR pull secret
        # `secrets` isn't a valid context in a step `if:` (only in `env:`), so the emptiness
        # check goes through an intermediate env var instead.
        if: ${{ env.GHCR_PAT != '' }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_PAT" \
            --namespace=blog \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tag
        working-directory: k8s
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.event.workflow_run.head_sha }}|" kustomization.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/web -n blog --timeout=180s
