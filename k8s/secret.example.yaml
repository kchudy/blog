# Template only — do NOT fill this in and commit it, and do NOT add it to kustomization.yaml's
# `resources`. Copy it out of the repo, fill in a real value, and apply it directly once:
#
#   cp k8s/secret.example.yaml /tmp/blog-secrets.yaml
#   # edit /tmp/blog-secrets.yaml: paste the output of
#   #   uv run python -c "from django.core.management.utils import get_random_secret_key as g; print(g())"
#   kubectl apply -f /tmp/blog-secrets.yaml
#   rm /tmp/blog-secrets.yaml
#
# Re-apply the same way whenever the value needs to change (e.g. rotation) — the Deployment picks
# it up on the next rollout (deployment.yaml's pod template doesn't reference the secret's
# resourceVersion, so trigger one manually with `kubectl rollout restart deployment/web -n blog`
# after rotating).
apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
  namespace: blog
type: Opaque
stringData:
  DJANGO_SECRET_KEY: changeme-generate-a-real-random-value
