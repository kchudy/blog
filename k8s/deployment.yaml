# Single-replica Deployment: SQLite (ADR-0002) is single-writer and its file lives on one
# ReadWriteOnce volume, so this intentionally does not scale horizontally — see
# .ai/decisions/ADR-0003-deploy-with-kubernetes.md. `strategy: Recreate` matters for the same
# reason: a RollingUpdate would briefly run old and new pods together, and two pods can't safely
# share one RWO SQLite file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: blog
  labels:
    app: blog
    component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blog
      component: web
  template:
    metadata:
      labels:
        app: blog
        component: web
    spec:
      # Only needed if the ghcr.io package is private — see k8s/README.md. Delete this field
      # (and the secret it references) if the package is public.
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          # Overwritten with a specific tag on every deploy (see .github/workflows/deploy.yml) —
          # `latest` here is only a placeholder for `kubectl apply -k k8s/` on its own.
          image: ghcr.io/kchudy/blog:latest
          command: ["uv", "run", "python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      containers:
        - name: web
          image: ghcr.io/kchudy/blog:latest
          command:
            ["uv", "run", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /feed/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /feed/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
