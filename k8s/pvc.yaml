# Holds the SQLite database file. ReadWriteOnce is sufficient because the web Deployment runs a
# single replica (SQLite is single-writer — see .ai/decisions/ADR-0002-use-sqlite-instead-of-postgres.md
# and ADR-0003-deploy-with-kubernetes.md). Do not scale this Deployment past 1 replica without
# revisiting the datastore first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-data
  namespace: blog
  labels:
    app: blog
    component: web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName intentionally omitted — uses the cluster's default StorageClass. Set one
  # explicitly here if your cluster doesn't define a default.
