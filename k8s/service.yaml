# ClusterIP only for now — front it with a port-forward, an existing reverse proxy, or add an
# Ingress/LoadBalancer later once there's a hostname to route.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: blog
  labels:
    app: blog
    component: web
spec:
  type: ClusterIP
  selector:
    app: blog
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
